# The app's environment, in one block so a knob is set in one place.
x-app-env: &app-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY -- copy .env.example to .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  # LLM provider/model selection -- see .env.example. Blank reads as unset,
  # so an operator who sets neither gets groq on its default model.
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  # Magic-link sign-in. Register a username/password account at /register,
  # or set LOGIN_ALLOWED_EMAILS in .env to your own address to sign in by
  # link -- for links the allowlist is the whole gate. Delivery
  # defaults to `console`: the link is printed to this container's log,
  # which is the demo path. No SMTP is involved.
  LOGIN_ALLOWED_EMAILS: ${LOGIN_ALLOWED_EMAILS:-}
  LOGIN_LINK_DELIVERY: ${LOGIN_LINK_DELIVERY:-console}
  LOGIN_LINK_BASE_URL: ${LOGIN_LINK_BASE_URL:-http://127.0.0.1:8000}
  LOGIN_TOKEN_TTL_SECONDS: ${LOGIN_TOKEN_TTL_SECONDS:-900}
  LOGIN_RATE_LIMIT_EMAIL: ${LOGIN_RATE_LIMIT_EMAIL:-5/hour}
  LOGIN_RATE_LIMIT_IP: ${LOGIN_RATE_LIMIT_IP:-20/hour}
  LOGIN_RESEND_COOLDOWN_SECONDS: ${LOGIN_RESEND_COOLDOWN_SECONDS:-30}
  # The Ethereum node the pipeline service polls -- see .env.example. Blank
  # reads as unset: web never calls it, and the pipeline stops on its first
  # tick with an error naming the variable.
  EVM_RPC_URL: ${EVM_RPC_URL:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Compose reads .env in this directory for ${VAR} interpolation. Run
    # `python scripts/setup_env.py` first: DJANGO_SECRET_KEY is required and
    # .env.example ships it blank on purpose. DATABASE_URL in the shared block
    # points at the Postgres service whatever .env says (the SQLite fallback in
    # project/settings.py is for running outside Docker). No LLM provider key is
    # needed: nothing the server runs calls a provider.
    environment: *app-env
    # Healthy once the entrypoint's migrate has applied every migration, so a
    # service that waits for it never races the migrate.
    healthcheck:
      test: ["CMD", "python", "manage.py", "migrate", "--check"]
      interval: 10s
      timeout: 10s
      retries: 10

  # The live pipeline: each tick stores the node's new blocks (from its head on;
  # there is no backfill), decodes their transactions and records what the
  # enabled rules match, for the console at http://127.0.0.1:8000 to show.
  # `docker compose up` leaves it out. With EVM_RPC_URL set in .env,
  #   docker compose --profile pipeline build
  #   docker compose run --rm pipeline --demo-rules admin
  # builds web's image and this one, then starts db and web, gives the account
  # admin (password admin, created if missing) the demo rules, and polls until
  # Ctrl-C; web keeps serving until `docker compose down`. The build is its own
  # step because `run --build` is missing from older Compose releases. Leave
  # the flag out to poll without the demo rules, and add run_pipeline's options
  # after it, e.g. `--interval 12`.
  pipeline:
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment: *app-env
    entrypoint: ["sh", "docker/pipeline.sh"]
    profiles: ["pipeline"]

volumes:
  postgres_data:
