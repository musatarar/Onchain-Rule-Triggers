# Reverse proxy in front of the web service's port 8000 (see docker-compose.yml).
server {
    listen 80;

    location / {
        proxy_pass http://web:8000;
        # Keep the browser's Host so DJANGO_ALLOWED_HOSTS applies to it, not "web".
        proxy_set_header Host $host;
        # Overwrite, never append: DRF's per-IP sign-in throttle keys on this
        # header, so a client-supplied value must not reach the app.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
