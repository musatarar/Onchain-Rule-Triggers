# Every process that runs the app reads the same environment, so `web`,
# `cron` and `ingest` share one block: a knob added for one is never quietly missing from
# the other.
x-app-env: &app-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY -- copy .env.example to .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  # LLM provider/model selection -- see .env.example. Blank reads as unset,
  # so an operator who sets neither gets groq on its default model.
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  # Actions engine: a dry run skips the provider entirely, so every inference
  # candidate comes back unevaluable and the tick costs nothing. Blank reads as
  # the settings.py default, which is a dry run -- set exactly "False" to spend.
  ACTIONS_LLM_DRY_RUN: ${ACTIONS_LLM_DRY_RUN:-}
  # Magic-link sign-in. The API is authenticated, so set
  # LOGIN_ALLOWED_EMAILS in .env to your own address or you cannot sign in
  # -- there is no signup flow, the allowlist is the whole gate. Delivery
  # defaults to `console`: the link is printed to this container's log,
  # which is the demo path. No SMTP is involved.
  LOGIN_ALLOWED_EMAILS: ${LOGIN_ALLOWED_EMAILS:-}
  LOGIN_LINK_DELIVERY: ${LOGIN_LINK_DELIVERY:-console}
  LOGIN_LINK_BASE_URL: ${LOGIN_LINK_BASE_URL:-http://127.0.0.1:8000}
  LOGIN_TOKEN_TTL_SECONDS: ${LOGIN_TOKEN_TTL_SECONDS:-900}
  LOGIN_RATE_LIMIT_EMAIL: ${LOGIN_RATE_LIMIT_EMAIL:-5/hour}
  LOGIN_RATE_LIMIT_IP: ${LOGIN_RATE_LIMIT_IP:-20/hour}
  LOGIN_RESEND_COOLDOWN_SECONDS: ${LOGIN_RESEND_COOLDOWN_SECONDS:-30}
  # The EVM node `ingest` reads new blocks and receipts from -- see .env.example.
  EVM_RPC_URL: ${EVM_RPC_URL:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Compose reads .env in this directory for ${VAR} interpolation. Run
    # `python scripts/setup_env.py` first: DJANGO_SECRET_KEY is required and
    # .env.example ships it blank on purpose. DATABASE_URL in the shared block
    # points at the Postgres service whatever .env says (the SQLite fallback in
    # project/settings.py is for running outside Docker). Set an LLM provider
    # key too for the copy step -- without one the server still starts and
    # serves the seeded demo data.
    environment: *app-env

  # The actions engine's scheduler, alongside the server rather than inside it:
  # same image and environment, its own process, so a tick that hangs cannot
  # take the web server with it. `web` owns migrations and seeding; this waits
  # for them rather than racing (docker/cron.sh).
  cron:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      # Seconds between ticks; read by docker/cron.sh, not by Django, so its
      # default lives in that script rather than in settings.py.
      ACTIONS_CRON_INTERVAL_SECONDS: ${ACTIONS_CRON_INTERVAL_SECONDS:-}
    entrypoint: ["sh", "docker/cron.sh"]
    restart: unless-stopped

  # Realtime block ingestion: one `ingest_blocks` tick a minute, storing every
  # block the node has past the last one stored, with its receipts. Same
  # scheduler script as `cron`, waiting on `web`'s migrations the same way.
  ingest:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    entrypoint: ["sh", "docker/cron.sh", "ingest_blocks", "60"]
    restart: unless-stopped

volumes:
  postgres_data:
